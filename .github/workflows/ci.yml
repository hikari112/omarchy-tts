name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Test suite
        run: |
          set +e
          test_log="$RUNNER_TEMP/omarchy-tts-tests.log"
          python3 -m unittest discover -s tests -v >"$test_log" 2>&1
          test_status=$?
          cat "$test_log"
          set -e
          if (( test_status != 0 )); then
            # Public Actions pages require sign-in to view logs. Preserve a
            # bounded list of test identifiers in the public Checks annotation.
            # The strict allowlist cannot disclose output, paths, or environment
            # data from a failing test.
            failure_ids="$(grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+ \([A-Za-z0-9_.]+\)$' "$test_log" \
              | head -20 | paste -sd ';' - || true)"
            [[ -n "$failure_ids" ]] || failure_ids="Test process failed before unittest reported an identifier"
            printf '::error title=Python test suite failed::%s\n' "$failure_ids"
          fi
          exit "$test_status"

      - name: Python syntax
        run: python3 -m py_compile bin/speak-bindings bin/speak-setup lib/sanitize.py tests/*.py

      - name: Shell syntax
        run: |
          for f in bin/speak bin/speak-voice providers/* ocr/* lib/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: ShellCheck
        run: shellcheck -x bin/speak bin/speak-voice providers/* ocr/* lib/*.sh tools/*

      - name: Manifest is valid
        run: |
          jq -e . manifest.json > /dev/null
          for field in schemaVersion id name version author license description kinds entryPoints; do
            jq -e "has(\"$field\")" manifest.json > /dev/null \
              || { echo "manifest.json missing required field: $field"; exit 1; }
          done
          entry=$(jq -r '.entryPoints.barWidget' manifest.json)
          test -f "$entry" || { echo "entry point not found: $entry"; exit 1; }

      - name: Plugin id matches QML moduleName
        run: |
          id=$(jq -r '.id' manifest.json)
          for f in BarWidget.qml Panel.qml; do
            grep -q "moduleName: \"$id\"" "$f" \
              || { echo "$f moduleName does not match manifest id ($id)"; exit 1; }
          done

      - name: Bar widget exposes the Quattro panel lifecycle
        run: |
          for method in open close toggle closeForPopoutSwitch; do
            grep -Eq "function ${method}\\(" BarWidget.qml \
              || { echo "BarWidget.qml missing ${method}()"; exit 1; }
          done
          grep -q 'readonly property bool opened:' BarWidget.qml \
            || { echo "BarWidget.qml missing opened state"; exit 1; }
          grep -q 'readonly property bool popoutSwitchClosing:' BarWidget.qml \
            || { echo "BarWidget.qml missing popout switch state"; exit 1; }

      - name: Providers are executable
        run: |
          for f in providers/* ocr/* bin/*; do
            test -x "$f" || { echo "not executable: $f"; exit 1; }
          done

      - name: Providers and OCR engines declare a description
        run: |
          for f in providers/* ocr/*; do
            grep -q '^# desc: ' "$f" || { echo "missing '# desc:' line: $f"; exit 1; }
          done
